<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 Puzzle Diário - React</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <!-- Bibliotecas React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Transpilador Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Seu código React/JSX -->
    <script type="text/babel">
        // ===============================================
        // CONFIGURAÇÕES DE PERSONALIZAÇÃO
        // ===============================================
        const SIZE = 4; // Dimensão do puzzle (4x4 = 15 peças + 1 espaço vazio)
        const SHUFFLE_MOVES = 50; // Quantidade de movimentos no embaralhamento
        const SOLVE_SPEED = 100; // Velocidade do replay em ms (menor = mais rápido)
        const GRID_COLS = {
            3: 'grid-cols-3',
            4: 'grid-cols-4', 
            5: 'grid-cols-5'
        };

        // Cores do tema (personalizáveis)
        const THEME = {
            background: "bg-gray-900", // Fundo da página
            title: "text-white", // Cor do título
            board: "bg-gray-700", // Fundo do tabuleiro
            piece: "bg-indigo-500 hover:bg-indigo-600", // Cor das peças (quando sem imagem)
            empty: "bg-gray-900", // Cor do espaço vazio
            button: "bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-500", // Classes do botão
        };

        // Dimensões das peças (personalizáveis)
        const PIECE_SIZE = {
            mobile: "w-16 h-16", // Tamanho em mobile
            desktop: "md:w-20 md:h-20", // Tamanho em desktop
            gap: "gap-1", // Espaçamento entre peças
            padding: "p-2", // Padding interno do tabuleiro
            radius: "rounded-xl", // Raio das bordas das peças
            boardRadius: "rounded-2xl", // Raio das bordas do tabuleiro
        };

        // Componente principal do puzzle
        function PuzzlePage() {
            // ===============================================
            // ESTADOS DO COMPONENTE
            // ===============================================
            const [board, setBoard] = React.useState([]);
            const [empty, setEmpty] = React.useState({ row: SIZE - 1, col: SIZE - 1 });
            const [history, setHistory] = React.useState([]);
            const [userMoves, setUserMoves] = React.useState([]);
            const [dailyImage, setDailyImage] = React.useState(null);
            const [imageLoaded, setImageLoaded] = React.useState(false);
            const [useNumbers, setUseNumbers] = React.useState(true); // Começa true até a imagem carregar

            // ===============================================
            // HOOK: CARREGAR IMAGEM LOCAL
            // ===============================================
            React.useEffect(() => {
                loadLocalImage();
            }, []);

            async function loadLocalImage() {
                try {
                    // **IMPORTANTE**: Certifique-se que este caminho está correto
                    // em relação ao seu arquivo HTML.
                    const imagePath = './assets/puzzle-images/image-tree.jpg';
                    
                    const img = new Image();
                    img.onload = () => {
                        setDailyImage(imagePath);
                        setImageLoaded(true);
                        setUseNumbers(false); // Sucesso: desativa o fallback de números
                    };
                    img.onerror = () => {
                        console.error(`Imagem em ${imagePath} não encontrada ou falhou ao carregar. Usando números.`);
                        setImageLoaded(true); // Finaliza o carregamento (com falha)
                        setUseNumbers(true); // Mantém o fallback de números
                    };
                    img.src = imagePath;
                } catch (error) {
                    console.error('Erro no bloco de carregamento de imagem:', error);
                    setImageLoaded(true);
                    setUseNumbers(true);
                }
            }

            // ===============================================
            // INICIALIZAÇÃO E EMBARALHAMENTO
            // (Sem alterações aqui)
            // ===============================================
            React.useEffect(() => {
                const solved = Array.from({ length: SIZE }, (_, r) => 
                    Array.from({ length: SIZE }, (_, c) => {
                        if (r === SIZE - 1 && c === SIZE - 1) return null;
                        return r * SIZE + c + 1;
                    })
                );
                setBoard(solved);
                shuffleBoard(solved);
            }, []);

            function shuffleBoard(startBoard) {
                let tempBoard = JSON.parse(JSON.stringify(startBoard));
                let tempEmpty = { row: SIZE - 1, col: SIZE - 1 };
                let moves = [];
                const directions = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];

                for (let i = 0; i < SHUFFLE_MOVES; i++) {
                    const validMoves = directions.filter(({ dr, dc }) => {
                        const newRow = tempEmpty.row + dr;
                        const newCol = tempEmpty.col + dc;
                        return newRow >= 0 && newRow < SIZE && newCol >= 0 && newCol < SIZE;
                    });
                    const move = validMoves[Math.floor(Math.random() * validMoves.length)];
                    const newRow = tempEmpty.row + move.dr;
                    const newCol = tempEmpty.col + move.dc;
                    const pieceValue = tempBoard[newRow][newCol];
                    moves.push({ piece: pieceValue, from: { row: newRow, col: newCol }, to: { row: tempEmpty.row, col: tempEmpty.col } });
                    tempBoard[tempEmpty.row][tempEmpty.col] = tempBoard[newRow][newCol];
                    tempBoard[newRow][newCol] = null;
                    tempEmpty = { row: newRow, col: newCol };
                }
                
                setBoard(tempBoard);
                setEmpty(tempEmpty);
                setHistory(moves);
                setUserMoves([]);
            }

            // ===============================================
            // LÓGICA DE MOVIMENTO E RESOLUÇÃO
            // (Sem alterações aqui)
            // ===============================================
            function movePiece(row, col) {
                const isValidMove = 
                    (Math.abs(row - empty.row) === 1 && col === empty.col) ||
                    (Math.abs(col - empty.col) === 1 && row === empty.row);

                if (isValidMove) {
                    const newBoard = JSON.parse(JSON.stringify(board));
                    const pieceValue = newBoard[row][col];
                    const userMove = { piece: pieceValue, from: { row, col }, to: { row: empty.row, col: empty.col } };
                    
                    newBoard[empty.row][empty.col] = newBoard[row][col];
                    newBoard[row][col] = null;
                    
                    setBoard(newBoard);
                    setEmpty({ row, col });
                    setUserMoves(prev => [...prev, userMove]);
                }
            }

            async function solvePuzzle() {
                let tempBoard = JSON.parse(JSON.stringify(board));
                let tempEmpty = { ...empty };

                const allMoves = [...userMoves].reverse().concat([...history].reverse());

                for (const move of allMoves) {
                    await new Promise(resolve => setTimeout(resolve, SOLVE_SPEED));
                     // O movimento reverso é trocar a peça com o espaço vazio
                    tempBoard[move.from.row][move.from.col] = move.piece;
                    tempBoard[move.to.row][move.to.col] = null;
                    tempEmpty = { row: move.to.row, col: move.to.col };
                    setBoard(JSON.parse(JSON.stringify(tempBoard)));
                    setEmpty({ ...tempEmpty });
                }
                setUserMoves([]);
            }
            
            // ===============================================
            // CÁLCULO DO ESTILO DA IMAGEM
            // ===============================================
            function getPieceImageStyle(value) {
                // Não aplica estilo se a imagem não estiver pronta, se for fallback, ou se for o espaço vazio
                if (useNumbers || !dailyImage || !imageLoaded || !value) {
                    return {};
                }
                
                // Calcula a posição original da peça para saber qual parte da imagem mostrar
                const targetRow = Math.floor((value - 1) / SIZE);
                const targetCol = (value - 1) % SIZE;
                
                return {
                    backgroundImage: `url(${dailyImage})`,
                    backgroundSize: `${SIZE * 100}% ${SIZE * 100}%`,
                    backgroundPosition: `${targetCol * -100}% ${targetRow * -100}%`,
                };
            }

            // ===============================================
            // RENDERIZAÇÃO DO COMPONENTE
            // ===============================================
            return (
                <div className={`min-h-screen flex flex-col items-center justify-center ${THEME.background} ${THEME.title} p-6`}>
                    <h1 className="text-3xl font-bold mb-6">🧩 Puzzle da Árvore</h1>
                    
                    <div className="mb-2 text-sm text-gray-400">
                        Status: {imageLoaded ? (useNumbers ? 'Falha ao carregar imagem, usando números.' : 'Imagem carregada!') : 'Carregando imagem...'}
                    </div>
                    
                    <div className={`grid ${GRID_COLS[SIZE]} ${PIECE_SIZE.gap} ${THEME.board} ${PIECE_SIZE.padding} ${PIECE_SIZE.boardRadius} shadow-lg`}>
                        {board.flat().map((val, index) => {
                            const r = Math.floor(index / SIZE);
                            const c = index % SIZE;
                            
                            const pieceStyle = getPieceImageStyle(val);
                            const hasImage = Object.keys(pieceStyle).length > 0;

                            return (
                                <div
                                    key={val === null ? 'empty-piece' : val}
                                    onClick={() => movePiece(r, c)}
                                    // **LÓGICA CORRIGIDA AQUI**
                                    className={`
                                        flex items-center justify-center 
                                        ${PIECE_SIZE.mobile} ${PIECE_SIZE.desktop} 
                                        ${PIECE_SIZE.radius} cursor-pointer select-none shadow-md
                                        transition-all duration-150
                                        ${!val ? THEME.empty : (hasImage ? '' : THEME.piece)}
                                    `}
                                    // **APLICAÇÃO DIRETA DO ESTILO AQUI**
                                    style={pieceStyle}
                                >
                                    {/* Mostra o número apenas se for o modo fallback e não for o espaço vazio */}
                                    {val && !hasImage && (
                                        <span className="text-xl font-bold text-white drop-shadow-lg">
                                            {val}
                                        </span>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    <button 
                        onClick={solvePuzzle} 
                        className={`mt-6 text-lg px-6 py-2 ${PIECE_SIZE.radius} text-white font-medium transition-colors ${THEME.button}`}
                        disabled={!imageLoaded}
                    >
                        {!imageLoaded ? 'Carregando...' : 'Resolver'}
                    </button>

                    {dailyImage && imageLoaded && !useNumbers && (
                        <div className="mt-4 text-center">
                            <p className="text-sm text-gray-400 mb-2">Imagem completa:</p>
                            <img 
                                src={dailyImage} 
                                alt="Imagem completa do puzzle" 
                                className="w-32 h-32 object-cover rounded-lg opacity-70 hover:opacity-100 transition-opacity cursor-pointer border border-gray-600"
                            />
                        </div>
                    )}
                </div>
            );
        }

        // Renderização da aplicação
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<PuzzlePage />);
    </script>
</body>
</html>
